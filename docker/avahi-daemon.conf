# mDNS for NDI discovery inside the BroadcastRelay container.
# It runs next to the host's own mDNS (host networking), under its own name, and only
# announces what NDI asks it to.
[server]
host-name=broadcastrelay
use-ipv4=yes
use-ipv6=no
enable-dbus=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-aaaa-on-ipv4=no

[reflector]
enable-reflector=no

[rlimits]
