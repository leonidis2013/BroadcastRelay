<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>BroadcastRelay</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  var p = 'auto';
  try { p = localStorage.getItem('br-theme') || 'auto'; } catch (e) {}
  var light = p === 'light' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
})();
</script>
<style>
  /* Same palette, controls and settings layout as LiveMic and the LivePi web page */
  :root { --bg:#0d1015; --card:#151a21; --card2:#1b2129; --line:#252c36; --fg:#d8dee6; --dim:#7c8794; --faint:#4c5561; --acc:#4c8dff; --teal:#2ec4b6; --bad:#ef4c4c; --ok:#3ecf6e; --warn:#f2c94c; --inset:#0b0e12; --knob:#d8dee6; --onacc:#0d1015; --shadow:#0008; --r:10px; color-scheme:dark; }
  :root[data-theme=light] { --bg:#e9edf2; --card:#fbfcfd; --card2:#f0f3f6; --line:#d3dae3; --fg:#18202b; --dim:#586474; --faint:#97a1ae; --acc:#2563d6; --teal:#0f9488; --bad:#d63232; --ok:#23a056; --warn:#cf9a10; --inset:#e3e8ee; --knob:#ffffff; --onacc:#ffffff; --shadow:#0003; color-scheme:light; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height:100vh; }
  .hide { display:none !important; }
  #app { padding:0 14px calc(20px + env(safe-area-inset-bottom)); }

  header { display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); margin-bottom:14px;
           background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  h1 { font-size:15px; margin:0; letter-spacing:.12em; text-transform:uppercase; font-weight:800; }
  h1 .ver { font-size:10px; font-weight:600; letter-spacing:.02em; text-transform:none; color:var(--dim); vertical-align:1px; margin-left:2px; }
  h1 small { display:block; font-size:10px; letter-spacing:.04em; color:var(--dim); font-weight:400; text-transform:none; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); margin:0 0 10px; font-weight:700; }
  h2::before { content:""; display:inline-block; width:3px; height:11px; background:var(--acc); border-radius:2px; margin-right:7px; vertical-align:-1px; }

  #status { flex:1; min-width:0; display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  #status::-webkit-scrollbar { display:none; }
  .st { flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; background:var(--card2); border-radius:999px; padding:3px 10px; font-size:12px; color:var(--dim); white-space:nowrap; }
  .st.bad { background:color-mix(in srgb, var(--bad) 18%, transparent); color:var(--bad); }
  .st.warn { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
  .st.ok { background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none; }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); } .dot.acc { background:var(--acc); }

  select, input, button, textarea { background:var(--card2); color:var(--fg); border:1px solid transparent; border-radius:8px; padding:7px 11px; font:inherit; }
  input:focus, select:focus, textarea:focus { outline:2px solid color-mix(in srgb, var(--acc) 55%, transparent); outline-offset:0; }
  button { cursor:pointer; font-weight:600; touch-action:manipulation; }
  button:hover { background:color-mix(in srgb, var(--card2) 80%, var(--fg) 8%); }
  button:disabled, input:disabled { opacity:.35; cursor:not-allowed; }
  button.on { background:var(--acc); color:var(--onacc); }
  button.on:hover { background:color-mix(in srgb, var(--acc) 88%, var(--fg) 12%); }
  button.danger { color:var(--bad); }
  .seg { display:inline-flex; background:var(--card2); border-radius:9px; padding:3px; gap:2px; }
  .seg button { border-radius:7px; background:transparent; padding:6px 12px; }
  .seg button.on { background:var(--acc); color:var(--onacc); }
  .note { color:var(--dim); font-size:12px; }
  a { color:var(--acc); text-decoration:none; } a:hover { text-decoration:underline; }

  /* header buttons: settings turns into Done */
  .gear { display:flex; align-items:center; justify-content:center; gap:6px; width:32px; height:32px; padding:0; border-radius:8px; background:transparent; color:var(--dim); }
  .gear:hover { color:var(--fg); background:var(--card2); }
  .gear svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .gear span { display:none; font-size:13px; }
  .gear.on { width:auto; padding:0 12px; background:var(--acc); color:var(--onacc); }
  .gear.on svg { display:none; } .gear.on span { display:inline; }
  .gear.spin svg { animation:spin 1s linear infinite; }
  #updAll { padding:6px 14px; }

  /* ===== devices ===== */
  #alerts { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  #alerts:empty { display:none; }
  .devs { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:12px; align-items:start; }
  .dev { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--ok); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:9px; min-width:0; }
  .dev.upd { border-left-color:var(--warn); }
  .dev.off { border-left-color:var(--bad); }
  .dev.busy { border-left-color:var(--acc); }
  .dev.none { border-left-color:var(--faint); }
  .dh { display:flex; align-items:center; gap:8px; min-width:0; }
  .dn { flex:1; min-width:0; font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dsub { font-size:12px; color:var(--dim); margin-top:-6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px; background:var(--card2); color:var(--dim); }
  .chip.t { background:color-mix(in srgb, var(--teal) 16%, transparent); color:var(--teal); }
  .rows { display:flex; flex-direction:column; border-top:1px solid var(--line); }
  .row { display:grid; grid-template-columns:76px 1fr auto; gap:8px; align-items:center; min-height:38px; padding:5px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .rl { font-size:10.5px; color:var(--dim); letter-spacing:.06em; text-transform:uppercase; }
  .rv { min-width:0; font-size:13px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .rv small { display:block; font-size:11.5px; color:var(--dim); }
  .rv .up { color:var(--warn); font-weight:700; } .rv .good { color:var(--ok); } .rv .bad { color:var(--bad); } .rv .arrow { color:var(--faint); padding:0 3px; }
  .row button { padding:5px 12px; font-size:12.5px; }
  .tag { font-size:11px; color:var(--dim); white-space:nowrap; }
  .df { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .df .when { flex:1; min-width:90px; font-size:11.5px; color:var(--dim); }
  .df button { padding:5px 11px; font-size:12.5px; }
  .jres { position:relative; padding-right:34px; } .jres .x { position:absolute; top:6px; right:6px; background:none; border:0; color:var(--dim); font-size:18px; line-height:1; padding:4px 8px; cursor:pointer; border-radius:6px; } .jres .x:hover { color:var(--fg); background:rgba(127,127,127,.15); }
  .errbox { border:1px solid color-mix(in srgb, var(--bad) 55%, transparent); background:color-mix(in srgb, var(--bad) 10%, transparent); border-radius:8px; padding:7px 10px; font-size:12.5px; }
  .errbox button { margin-top:6px; padding:4px 10px; font-size:12.5px; }
  .okbox { border:1px solid color-mix(in srgb, var(--ok) 50%, transparent); background:color-mix(in srgb, var(--ok) 10%, transparent); border-radius:8px; padding:7px 10px; font-size:12.5px; }
  .jobbox { border:1px solid color-mix(in srgb, var(--acc) 45%, transparent); background:color-mix(in srgb, var(--acc) 8%, transparent); border-radius:8px; padding:8px 10px; font-size:12.5px; display:flex; flex-direction:column; gap:5px; }
  .jstep { display:flex; align-items:center; gap:7px; }
  .jstep .ic { width:14px; text-align:center; flex:none; font-weight:800; }
  .jstep.ok .ic { color:var(--ok); } .jstep.failed .ic { color:var(--bad); } .jstep.skipped { color:var(--faint); } .jstep.pending { color:var(--dim); }
  .jstep.running .ic::before { content:""; display:inline-block; width:10px; height:10px; border:2px solid var(--acc); border-top-color:transparent; border-radius:50%; animation:spin .9s linear infinite; vertical-align:-1px; }
  pre.tail { margin:2px 0 0; font:11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:var(--dim); white-space:pre-wrap; overflow-wrap:anywhere; max-height:66px; overflow:hidden; }
  .link { background:none; border:0; padding:0; color:var(--acc); font-weight:600; font-size:12px; }
  .link:hover { background:none; text-decoration:underline; }
  .empty { color:var(--dim); text-align:center; padding:60px 10px; }

  /* ===== settings (same layout as LiveMic and LivePi's Setup) ===== */
  .setup { display:flex; gap:14px; align-items:flex-start; }
  .side { display:flex; flex-direction:column; gap:4px; width:168px; flex:0 0 168px; position:sticky; top:64px; }
  .side button { display:flex; align-items:center; gap:9px; text-align:left; background:transparent; color:var(--dim); font-weight:600; border-color:transparent; }
  .side button svg { width:16px; height:16px; flex:0 0 16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .side button:hover { color:var(--fg); }
  .side button.on { background:var(--card); border-color:var(--line); color:var(--acc); box-shadow:inset 3px 0 0 var(--acc); }
  .pane { flex:1; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:14px; max-width:820px; }
  .set { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
  .card > h2 + .set, .set.first { border-top:0; }
  .sl { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .sl b { font-weight:600; font-size:14px; }
  .sl span { font-size:12px; color:var(--dim); line-height:1.35; }
  .sl span:empty { display:none; }
  .sc { flex:0 1 auto; display:flex; gap:6px; align-items:center; justify-content:flex-end; flex-wrap:wrap; min-width:0; }
  .sc input.txt { width:120px; max-width:100%; }
  .sc input.num { width:72px; text-align:center; }
  .sc input.wide { width:190px; max-width:100%; }
  .sc select { max-width:170px; }
  .sc .to { font-size:12px; color:var(--dim); }
  .sc .val { font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; text-align:right; }
  .sc .val.ok { color:var(--ok); } .sc .val.warn { color:var(--warn); } .sc .val.bad { color:var(--bad); }
  .pnote { max-width:820px; margin:0 0 12px; }
  details > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; min-height:28px; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:"›"; margin-left:auto; color:var(--dim); font-size:20px; line-height:1; transition:transform .15s; }
  details[open] > summary::after { transform:rotate(90deg); }
  details > summary b { font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:13px; }
  details > summary .note { margin-left:2px; }
  details.fold > summary b, details.dcard > summary b { flex:0 1 auto; }
  details.dcard[open] > summary, details.fold[open] > summary { margin-bottom:8px; }
  details.sub { border-top:1px solid var(--line); margin-top:6px; padding-top:10px; }
  details.sub > summary { color:var(--dim); font-size:13px; font-weight:600; }
  details.fold > .card { border:0; padding:0; margin:0 0 6px; max-width:none; background:transparent; }
  .locknote { border:1px solid var(--warn); background:color-mix(in srgb, var(--warn) 12%, transparent); border-radius:6px; padding:8px 10px; margin-bottom:12px; font-size:13px; max-width:820px; }
  .formerr { color:var(--bad); font-size:12.5px; padding:4px 0 2px; }
  .keybox { width:100%; font:11.5px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize:none; height:64px; }
  .found { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .found .fi { flex:1; min-width:0; } .found .fi b { display:block; font-weight:600; } .found .fi span { font-size:12px; color:var(--dim); }
  .dcard h3 { margin:0 0 4px; font-size:14px; }
  .act { display:flex; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line); cursor:pointer; }
  .act:first-child { border-top:0; }
  .act:hover { background:color-mix(in srgb, var(--card2) 60%, transparent); }
  .act .ai { flex:1; min-width:0; } .act .ai b { display:block; font-weight:600; } .act .ai span { font-size:12px; color:var(--dim); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bk { display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); font-size:13px; }
  .bk span { flex:1; min-width:0; overflow-wrap:anywhere; } .bk small { color:var(--dim); }

  /* confirm and log windows */
  .scrim { position:fixed; inset:0; background:#0009; z-index:40; display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:12px; width:min(560px, 100%); max-height:calc(100vh - 32px); display:flex; flex-direction:column; box-shadow:0 12px 40px var(--shadow); }
  .modal.big { width:min(860px, 100%); }
  .mh { padding:14px 16px 4px; font-weight:700; font-size:15px; }
  .mb { padding:6px 16px 12px; overflow:auto; font-size:13.5px; }
  .mf { padding:10px 16px 14px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .mf .sp { flex:1; }
  .pstep { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); }
  .pstep:first-child { border-top:0; }
  .pstep input { margin-top:3px; padding:0; width:16px; height:16px; accent-color:var(--acc); }
  .pstep b { display:block; font-weight:600; } .pstep span { font-size:12.5px; color:var(--dim); }
  .pdev { font-weight:700; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); padding:12px 0 2px; }
  pre.log { margin:0; font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre-wrap; overflow-wrap:anywhere; background:var(--inset); border-radius:8px; padding:10px; max-height:60vh; overflow:auto; }

  .toast { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--card); color:var(--fg); border:1px solid var(--bad);
           padding:8px 14px; border-radius:999px; font-size:14px; display:none; z-index:80; max-width:90vw; box-shadow:0 6px 24px var(--shadow); }
  .toast.show { display:block; } .toast.good { border-color:var(--ok); }

  .offbar { display:none; position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:60; background:var(--bad); color:#fff;
            padding:10px 16px; border-radius:999px; font-weight:600; font-size:14px; box-shadow:0 6px 24px var(--shadow); align-items:center; gap:10px; white-space:nowrap; }
  body.offline .offbar { display:flex; }
  body.offline #tab-main, body.offline #tab-setup, body.offline #tab-claude { filter:grayscale(1); opacity:.4; pointer-events:none; user-select:none; }
  .spin { width:14px; height:14px; border:2px solid #fff6; border-top-color:#fff; border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width:720px) {
    header { row-gap:6px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top)); gap:8px; }
    header h1 { font-size:14px; } header h1 small { display:none; }
    #status { order:3; flex:1 0 100%; }
    .gear { order:2; } .hsec { order:2; padding:0 9px; } .hsec .lbl { display:none; } #fsBtn { margin-left:auto; order:1; } #chkAll { order:1; } #updAll { order:1; }
    h1 { order:0; }
    #app { padding-left:10px; padding-right:10px; }
    .devs { grid-template-columns:1fr; }
    .setup { flex-direction:column; align-items:stretch; gap:10px; }
    .side { flex-direction:row; width:100%; flex:none; overflow-x:auto; position:static; scrollbar-width:none; gap:6px; }
    .side::-webkit-scrollbar { display:none; }
    .side button { flex:0 0 auto; min-height:38px; padding:6px 14px; border-radius:999px; background:var(--card2); font-size:14px; border:0; box-shadow:none; }
    .side button.on { background:var(--acc); color:var(--onacc); box-shadow:none; }
    .card { padding:12px; }
    .set { padding:10px 0; gap:10px; flex-wrap:wrap; }
    .sl { flex:1 1 100%; }
    .sc { flex:1 1 100%; justify-content:flex-start; }
    .sc input.txt { width:110px; font-size:16px; } .sc input.num { font-size:16px; } .sc input.wide { width:100%; font-size:16px; }
    .sc button { min-height:38px; padding:6px 12px; font-size:15px; }
    .sc .seg button { min-height:34px; padding:4px 10px; font-size:14px; }
    .row button, .df button { min-height:34px; }
    .set.feat { flex-wrap:nowrap; } .set.feat .sl { flex:1 1 0; } .set.feat .sc { flex:0 0 auto; }
    body.in-setup #status { display:none; }
  }

  /* ===== BroadcastRelay ===== */
  :root { --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --live:#ef4c4c; }
  #goLive { padding:6px 14px; background:var(--ok); color:var(--onacc); }
  #goLive:hover { background:color-mix(in srgb, var(--ok) 85%, var(--fg) 15%); }
  #endAll { padding:6px 14px; color:var(--bad); }
  .st.live { background:var(--live); color:#fff; font-weight:700; }
  .st.live .dot { background:#fff; animation:blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .dev.wide { grid-column:1/-1; }
  .dev.live { border-left-color:var(--live); }
  .dev.idle { border-left-color:var(--faint); }
  .dev.warn { border-left-color:var(--warn); }
  .chip.l { background:var(--live); color:#fff; }
  .chip.w { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
  .chip.b { background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad); }
  .chip.o { background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); }
  .chip.a { background:color-mix(in srgb, var(--acc) 16%, transparent); color:var(--acc); }

  /* input: preview + meters */
  .inrow { display:grid; grid-template-columns:minmax(0, 520px) minmax(0, 1fr) 230px; gap:14px; align-items:start; }
  .inr { border-top:0; } .inr .row:first-child { padding-top:0; }
  @media (max-width:1100px) { .inrow { grid-template-columns:minmax(0, 1fr) 230px; } .inr { grid-column:1/-1; order:3; border-top:1px solid var(--line); } }
  .pv { position:relative; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
  .pv video { width:100%; height:100%; object-fit:contain; display:block; }
  .pv .ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:#9aa5b1; font-size:13px; text-align:center; padding:10px; }
  .pv .ov b { color:#d8dee6; font-size:15px; letter-spacing:.08em; text-transform:uppercase; }
  .pv .pvb { position:absolute; right:8px; top:8px; padding:3px 9px; font-size:11.5px; background:#000a; color:#d8dee6; border-radius:6px; }
  .pv .tag2 { position:absolute; left:8px; top:8px; font-size:10.5px; font-weight:800; letter-spacing:.1em; background:var(--live); color:#fff; padding:2px 7px; border-radius:4px; }
  .meters { display:flex; flex-direction:column; gap:10px; min-width:0; }
  .mbox { background:var(--inset); border-radius:8px; padding:8px; display:flex; gap:10px; }
  .mbox canvas { width:62px; height:200px; flex:none; }
  .lufs { flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .lu { display:flex; flex-direction:column; }
  .lu span { font-size:10px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
  .lu b { font:700 20px/1.1 var(--mono); font-variant-numeric:tabular-nums; }
  .lu b small { font-size:10px; color:var(--dim); font-weight:400; margin-left:2px; }
  .lu.hot b { color:var(--warn); } .lu.over b { color:var(--bad); }
  .tgt { font-size:11px; color:var(--dim); }

  /* destination editor, misc */
  .add { border:1px dashed var(--line); border-left:1px dashed var(--line); background:transparent; align-items:center; justify-content:center; min-height:120px; color:var(--dim); cursor:pointer; }
  .add:hover { color:var(--fg); border-color:var(--faint); }
  .add b { font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
  .rv.mono, .mono { font-family:var(--mono); font-size:12px; }
  .stats { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12.5px; font-variant-numeric:tabular-nums; }
  .stats span { color:var(--dim); } .stats b { font-weight:600; color:var(--fg); }
  .cmd { display:block; width:100%; margin:0; font:12px/1.45 var(--mono); background:var(--inset); color:var(--fg); border-radius:8px; padding:9px 10px; white-space:pre-wrap; overflow-wrap:anywhere; user-select:all; }
  .copyrow { display:flex; gap:8px; align-items:flex-start; margin-top:6px; }
  .copyrow .cmd { flex:1; min-width:0; }
  .code { font:700 30px/1 var(--mono); letter-spacing:.14em; background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:12px 16px; display:inline-block; margin:6px 0; }
  .fgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
  .fld { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .fld > span { font-size:11px; color:var(--dim); letter-spacing:.06em; text-transform:uppercase; }
  .fld input, .fld select, .fld textarea { width:100%; }
  .fld.wide { grid-column:1/-1; }
  .msec { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin:14px 0 8px; }
  .msec:first-child { margin-top:2px; }
  .reclist { display:flex; flex-direction:column; border-top:1px solid var(--line); max-height:220px; overflow:auto; }
  .rec { display:flex; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .rec .ri { flex:1; min-width:0; } .rec .ri small { display:block; color:var(--dim); font-size:11.5px; }
  .rec button { padding:4px 9px; font-size:12px; }
  .bar2 { height:6px; background:var(--card2); border-radius:3px; overflow:hidden; }
  .bar2 i { display:block; height:100%; background:var(--acc); }
  .bar2.warn i { background:var(--warn); } .bar2.bad i { background:var(--bad); }
  .login { max-width:360px; margin:12vh auto 0; }
  .login input { width:100%; margin:6px 0; font-size:16px; }
  .login button { width:100%; margin-top:6px; padding:10px; }
  .hint { font-size:12px; color:var(--dim); margin-top:6px; }
  .tailbox { margin:0; font:11px/1.35 var(--mono); color:var(--dim); white-space:pre-wrap; overflow-wrap:anywhere; max-height:90px; overflow:auto; background:var(--inset); border-radius:6px; padding:6px 8px; }
  table.kv { border-collapse:collapse; width:100%; font-size:13px; }
  table.kv td { padding:6px 4px; border-top:1px solid var(--line); vertical-align:top; }
  table.kv td:first-child { color:var(--dim); width:38%; }
  .ndis { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .ndis button { text-align:left; display:flex; gap:8px; align-items:center; background:var(--card2); }
  .ndis button.on { background:var(--acc); color:var(--onacc); }
  .ndis small { opacity:.7; font-weight:400; margin-left:auto; font-family:var(--mono); font-size:11px; }
  @media (max-width:720px) {
    .inrow { grid-template-columns:1fr; } .inr { order:2; }
    header h1 { flex:1 1 auto; }
    .mbox canvas { height:120px; }
    #goLive, #endAll { order:1; }
    .fgrid { grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>BroadcastRelay <span class="ver" id="hVer"></span><small>Stream relay</small></h1>
  <div id="status"></div>
  <button id="goLive" class="hide" title="Start every destination marked for Go live">Go live</button>
  <button id="endAll" class="hide" title="Stop every destination">End</button>
  <button id="gear" class="gear" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Done</span></button>
</header>
<div class="offbar"><span class="spin"></span>Lost connection to BroadcastRelay. Retrying…</div>

<div id="app">
<section id="tab-login" class="hide">
  <div class="card login">
    <h2 id="lgTitle">Sign in</h2>
    <div class="note" id="lgNote"></div>
    <input type="password" id="lgPw" placeholder="Password" autocomplete="current-password">
    <input type="password" id="lgPw2" class="hide" placeholder="Same password again" autocomplete="new-password">
    <div class="formerr hide" id="lgErr"></div>
    <button class="on" id="lgBtn">Sign in</button>
  </div>
</section>

<section id="tab-main" class="hide">
  <div id="alerts"></div>
  <div class="devs" id="grid">
    <article class="dev wide idle" id="inCard">
      <div class="dh"><span class="dot" id="inDot"></span><div class="dn">Input</div><div class="chips" id="inChips"></div></div>
      <div class="inrow">
        <div class="pv"><video id="pvVid" muted playsinline autoplay></video><div class="ov" id="pvOv"><b>No input</b><span id="pvOvTxt"></span></div><span class="tag2 hide" id="pvLive">LIVE</span><button class="pvb" id="pvBtn">Preview off</button></div>
        <div class="rows inr" id="inRows"></div>
        <div class="meters">
          <div class="mbox"><canvas id="mCan" width="124" height="400"></canvas>
            <div class="lufs">
              <div class="lu" id="luM"><span>Momentary</span><b>–</b></div>
              <div class="lu" id="luS"><span>Short-term</span><b>–</b></div>
              <div class="lu" id="luI"><span>Integrated</span><b>–</b></div>
              <div class="lu" id="luR"><span>Range</span><b>–</b></div>
              <div class="lu" id="luT"><span>True peak</span><b>–</b></div>
            </div>
          </div>
          <div class="tgt">Streaming target: about −16 to −14 LUFS short-term, true peak below −1 dBTP. YouTube and Facebook turn down anything louder.</div>
        </div>
      </div>
    </article>
  </div>
</section>

<section id="tab-setup" class="hide">
 <div class="setup">
  <div class="side" id="side">
    <button data-pane="input" class="on"><svg viewBox="0 0 24 24"><path d="M4 12h12M12 6l6 6-6 6M20 4v16"/></svg><span>Input</span></button>
    <button data-pane="dests"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><path d="M7 12h4M11 12l8-6M11 12l8 6M11 12h8"/></svg><span>Destinations</span></button>
    <button data-pane="web"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M10 9l4 2-4 2z M8 21h8"/></svg><span>Web player</span></button>
    <button data-pane="ndi"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0"/><circle cx="12" cy="12" r="1"/><path d="M12 13v7"/></svg><span>NDI</span></button>
    <button data-pane="rec"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span>Recording</span></button>
    <button data-pane="youtube"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/></svg><span>YouTube</span></button>
    <button data-pane="facebook"><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg><span>Facebook</span></button>
    <button data-pane="companion"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Companion</span></button>
    <button data-pane="network"><svg viewBox="0 0 24 24"><rect x="2" y="14" width="20" height="7" rx="2"/><path d="M6 17.5h.01M10 17.5h.01M12 14V8M8 4h8v4H8z"/></svg><span>Ports</span></button>
    <button data-pane="system"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>System</span></button>
  </div>
  <div class="pane" id="pane"></div>
 </div>
</section>
</div>

<div class="toast" id="toast"></div>
<div id="modal"></div>

<script src="whep.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var S = null, ST = null, LV = null, tab = 'main', pane = 'input', es = null, themePref = 'auto';
  try { themePref = localStorage.getItem('br-theme') || 'auto'; } catch (e) {}

  // ---------- formatting ----------
  function dur(ms) {
    if (ms == null || ms < 0) return '';
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return h ? h + 'h ' + (m < 10 ? '0' : '') + m + 'm' : m ? m + 'm ' + (s % 60 < 10 ? '0' : '') + (s % 60) + 's' : (s % 60) + 's';
  }
  function bytes(n) { if (n == null) return ''; var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0; while (n >= 1000 && i < 4) { n /= 1000; i++; } return (n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)) + ' ' + u[i]; }
  function rate(k) { if (k == null) return '–'; return k >= 1000 ? (k / 1000).toFixed(1) + ' Mb/s' : Math.round(k) + ' kb/s'; }
  function fps(f) { return f ? (Math.round(f * 100) / 100) + '' : ''; }
  function resLabel(v) { if (!v || !v.height) return ''; return v.width + '×' + v.height + (v.fps ? ' ' + fps(v.fps) + 'fps' : ''); }
  function when(t) { var d = new Date(t); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
  var STATE_TXT = { off: 'Off', starting: 'Starting', live: 'Live', retrying: 'Reconnecting', error: 'Stopped', waiting: 'Waiting for input', creating: 'Creating broadcast', ending: 'Ending broadcast' };
  function stCls(st) { return st === 'live' ? 'live' : st === 'error' ? 'off' : st === 'retrying' ? 'warn' : st === 'off' ? 'idle' : 'busy'; }
  function chipFor(st) { var c = st === 'live' ? 'l' : st === 'error' ? 'b' : st === 'retrying' ? 'w' : st === 'off' ? '' : 'a'; return '<span class="chip ' + c + '">' + esc(STATE_TXT[st] || st) + '</span>'; }

  function toast(msg, good) {
    var t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (good ? ' good' : '');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = 'toast'; }, good ? 2200 : 5000);
  }

  // ---------- server ----------
  function call(method, path, body) {
    return fetch(path, { method: method, credentials: 'same-origin', headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (r.status === 401 && j.login) { showLogin(j.setup); return { ok: false, error: 'Sign in first' }; }
          if (j.ok === undefined) j.ok = r.ok;
          return j;
        });
      })
      .catch(function () { return { ok: false, error: 'Could not reach BroadcastRelay' }; });
  }
  function act(path, okMsg) {
    return call('POST', path).then(function (r) { if (!r.ok) toast(r.error || 'That did not work'); else if (okMsg) toast(okMsg, true); return r; });
  }
  function saveSection(section, values, msg) {
    return call('POST', 'api/settings', { section: section, values: values }).then(function (r) {
      if (!r.ok) toast(r.error || 'Not saved'); else toast(msg || 'Saved', true);
      return r;
    });
  }

  function start() {
    call('GET', 'api/state').then(function (j) {
      if (!j || !j.version) return;
      S = j; ST = j.status;
      show(tab === 'login' ? 'main' : tab);
      openEvents();
    });
  }
  function openEvents() {
    if (es) es.close();
    es = new EventSource('api/events');
    es.addEventListener('state', function (e) { S = JSON.parse(e.data); ST = S.status; document.body.classList.remove('offline'); renderAll(true); });
    es.addEventListener('status', function (e) { ST = JSON.parse(e.data); if (S) S.status = ST; document.body.classList.remove('offline'); renderAll(false); });
    es.addEventListener('levels', function (e) { LV = JSON.parse(e.data); LV && (LV.at = Date.now()); });
    es.onerror = function () {
      document.body.classList.add('offline');
      // a 401 looks like an error to EventSource: check whether we are signed out
      setTimeout(function () { call('GET', 'api/state').then(function (j) { if (j && j.version && es.readyState === 2) openEvents(); }); }, 3000);
    };
  }

  // ---------- login ----------
  function showLogin(setup) {
    if (es) { es.close(); es = null; }
    tab = 'login';
    ['main', 'setup'].forEach(function (t) { $('#tab-' + t).classList.add('hide'); });
    $('#tab-login').classList.remove('hide');
    $('#goLive').classList.add('hide'); $('#endAll').classList.add('hide'); $('#gear').classList.add('hide');
    $('#lgTitle').textContent = setup ? 'Set a password' : 'Sign in';
    $('#lgNote').textContent = setup ? 'Choose the password for this control page (at least 8 characters). The web player stays open to everyone.' : '';
    $('#lgPw2').classList.toggle('hide', !setup);
    $('#lgPw').setAttribute('autocomplete', setup ? 'new-password' : 'current-password');
    $('#lgBtn').textContent = setup ? 'Save and sign in' : 'Sign in';
    $('#lgBtn').dataset.setup = setup ? '1' : '';
    $('#lgPw').focus();
  }
  function doLogin() {
    var pw = $('#lgPw').value, setup = $('#lgBtn').dataset.setup === '1';
    if (setup && pw !== $('#lgPw2').value) { $('#lgErr').textContent = 'The two passwords are different.'; $('#lgErr').classList.remove('hide'); return; }
    call('POST', 'api/login', { password: pw }).then(function (r) {
      if (!r.ok) { $('#lgErr').textContent = r.error || 'Could not sign in'; $('#lgErr').classList.remove('hide'); return; }
      $('#lgErr').classList.add('hide'); $('#lgPw').value = ''; $('#lgPw2').value = '';
      $('#gear').classList.remove('hide');
      tab = 'main'; start();
    });
  }
  $('#lgBtn').onclick = doLogin;
  $('#lgPw').onkeydown = $('#lgPw2').onkeydown = function (e) { if (e.key === 'Enter') doLogin(); };

  // ---------- tabs ----------
  function show(t) {
    tab = t;
    ['login', 'main', 'setup'].forEach(function (x) { $('#tab-' + x).classList.toggle('hide', x !== t); });
    $('#gear').classList.toggle('on', t === 'setup');
    $('#gear').classList.remove('hide');
    document.body.classList.toggle('in-setup', t === 'setup');
    if (t === 'setup') renderPane(true);
    renderAll(true);
  }
  $('#gear').onclick = function () { show(tab === 'setup' ? 'main' : 'setup'); };
  $$('#side button').forEach(function (b) { b.onclick = function () { pane = b.dataset.pane; $$('#side button').forEach(function (x) { x.classList.toggle('on', x === b); }); renderPane(true); window.scrollTo(0, 0); }; });

  function renderAll(full) {
    if (!S || !ST) return;
    $('#hVer').textContent = 'v' + S.version + (S.demo ? ' demo' : '');
    renderHeader();
    if (tab === 'main') renderMain();
    if (tab === 'setup') { if (full) renderPane(false); else livePane(); }
  }

  // ---------- header ----------
  function renderHeader() {
    var i = ST.input, pills = [];
    if (ST.mediamtx.state !== 'live') pills.push('<span class="st bad"><span class="dot bad"></span>Relay ' + esc(STATE_TXT[ST.mediamtx.state] || ST.mediamtx.state) + '</span>');
    if (i.ready) pills.push('<span class="st ok"><span class="dot ok"></span>' + esc(i.protocol || 'Input') + ' ' + esc(i.video && i.video.height ? i.video.height + 'p' + (i.video.fps ? Math.round(i.video.fps) : '') : '') + ' · ' + rate(i.kbps) + '</span>');
    else pills.push('<span class="st"><span class="dot"></span>No input</span>');
    var live = ST.destinations.filter(function (d) { return d.state === 'live'; }).length;
    if (live) pills.push('<span class="st live"><span class="dot"></span>Live · ' + live + '</span>');
    var bad = ST.destinations.filter(function (d) { return d.state === 'retrying' || d.state === 'error'; }).length;
    if (bad) pills.push('<span class="st warn"><span class="dot warn"></span>' + bad + ' need attention</span>');
    if (ST.recording.active) pills.push('<span class="st bad"><span class="dot bad"></span>REC</span>');
    if (ST.web.enabled && ST.web.state === 'live') pills.push('<span class="st"><span class="dot acc"></span>Web · ' + ST.web.viewers.total + ' watching</span>');
    if (ST.ndiOut.enabled) pills.push('<span class="st' + (ST.ndiOut.state === 'live' ? ' ok' : '') + '"><span class="dot' + (ST.ndiOut.state === 'live' ? ' ok' : '') + '"></span>NDI out' + (ST.ndiOut.connections ? ' · ' + ST.ndiOut.connections : '') + '</span>');
    if (ST.cpu.total != null) pills.push('<span class="st' + (ST.cpu.total > 90 ? ' bad' : ST.cpu.total > 75 ? ' warn' : '') + '">CPU ' + Math.round(ST.cpu.total) + '%</span>');
    $('#status').innerHTML = pills.join('');
    var anyOn = ST.destinations.some(function (d) { return d.state !== 'off' && d.state !== 'error'; });
    $('#goLive').classList.toggle('hide', tab !== 'main' || !S.settings.destinations.length);
    $('#endAll').classList.toggle('hide', tab !== 'main' || !anyOn);
  }
  $('#goLive').onclick = function () {
    var armed = S.settings.destinations.filter(function (d) { return d.armed; });
    if (!armed.length) return toast('No destination is marked "Include in Go live". Edit a destination to include it.');
    confirmBox('Go live?', 'Starts ' + armed.map(function (d) { return '<b>' + esc(d.name) + '</b>'; }).join(', ') + ' and the web player.', 'Go live', function () { act('api/v1/golive', 'Going live'); });
  };
  $('#endAll').onclick = function () { confirmBox('End the stream?', 'Stops every destination and ends the broadcasts on YouTube and Facebook. The web player and recording keep running while the input is connected.', 'End', function () { act('api/v1/end', 'Ended'); }, true); };

  // ---------- modal ----------
  function modal(html, big) {
    $('#modal').innerHTML = '<div class="scrim"><div class="modal' + (big ? ' big' : '') + '">' + html + '</div></div>';
    $('.scrim').addEventListener('mousedown', function (e) { if (e.target.classList.contains('scrim')) closeModal(); });
    document.addEventListener('keydown', escKey);
  }
  function closeModal() { $('#modal').innerHTML = ''; document.removeEventListener('keydown', escKey); }
  function escKey(e) { if (e.key === 'Escape') closeModal(); }
  function confirmBox(title, body, okLabel, fn, danger) {
    modal('<div class="mh">' + esc(title) + '</div><div class="mb">' + body + '</div><div class="mf"><button id="mNo">Cancel</button><button id="mYes" class="' + (danger ? 'danger' : 'on') + '">' + esc(okLabel) + '</button></div>');
    $('#mNo').onclick = closeModal; $('#mYes').onclick = function () { closeModal(); fn(); };
  }

  // ---------- main ----------
  var cardsKey = '';
  function renderMain() {
    renderInput();
    var g = $('#grid');
    var key = S.settings.destinations.map(function (d) { return d.id; }).join(',');
    if (key !== cardsKey) {
      $$('.dyn', g).forEach(function (x) { x.remove(); });
      S.settings.destinations.forEach(function (d) { g.insertAdjacentHTML('beforeend', '<article class="dev dyn" data-dest="' + d.id + '"></article>'); });
      g.insertAdjacentHTML('beforeend', '<article class="dev dyn add" id="addDest"><b>+ Add destination</b><span class="note">YouTube, Facebook, RTMP or SRT</span></article>');
      g.insertAdjacentHTML('beforeend', '<article class="dev dyn" id="webCard"></article><article class="dev dyn" id="ndiCard"></article><article class="dev dyn" id="recCard"></article>');
      cardsKey = key;
    }
    S.settings.destinations.forEach(function (d, i) { renderDest($('[data-dest="' + d.id + '"]'), d, ST.destinations[i] || { state: 'off' }); });
    renderWeb(); renderNdiOut(); renderRec();
    renderAlerts();
  }

  function renderAlerts() {
    var a = [];
    if (ST.mediamtx.state === 'error' || ST.mediamtx.state === 'retrying') a.push('<div class="errbox">The relay server (MediaMTX) is not running: ' + esc(ST.mediamtx.error || '') + '. Another app may be using one of its ports; check Settings › Ports.</div>');
    if (!ST.recording.writable && ST.recording.enabled) a.push('<div class="errbox">Recordings cannot be saved to <b>' + esc(ST.recording.dir) + '</b>. Give the container\'s user (uid 1000) write access to that dataset.</div>');
    var y = ST.platforms.youtube, f = ST.platforms.facebook;
    if (y.needsReconnect) a.push('<div class="errbox">YouTube needs to be connected again (Settings › YouTube).</div>');
    if (f.needsReconnect) a.push('<div class="errbox">Facebook needs to be connected again (Settings › Facebook).</div>');
    var html = a.join('');
    if ($('#alerts').innerHTML !== html) $('#alerts').innerHTML = html;
  }

  // input card

    var c = $('#mCan'), g = c.getContext('2d'), W = c.width, H = c.height;
    var cs = getComputedStyle(document.documentElement);
    var col = function (v) { return cs.getPropertyValue(v).trim(); };
    var lv = LV && Date.now() - LV.at < 1500 ? LV : null;
    g.clearRect(0, 0, W, H);
    var top = 8, bot = H - 22, mn = -60;
    var y = function (db) { return top + (bot - top) * (1 - (Math.max(mn, Math.min(0, db)) - mn) / -mn); };
    g.font = '18px system-ui'; g.fillStyle = col('--dim'); g.textAlign = 'right';

      var v = lv && lv.peak && lv.peak.length ? (lv.peak[ch] != null ? lv.peak[ch] : lv.peak[0]) : -120;
      shown[ch] = v > shown[ch] ? v : Math.max(v, shown[ch] - 1.2);

        set('App ID', '', inp('appId', f.appId)) +
        set('Client token', f.hasClientToken ? 'Saved' : '', '<input data-f="clientToken" type="password" class="wide" autocomplete="new-password" placeholder="' + (f.hasClientToken ? 'Saved. Type to replace' : '') + '">') +
        set('App secret', 'Optional. Makes the sign-in last (otherwise about 60 days)', '<input data-f="appSecret" type="password" class="wide" autocomplete="new-password" placeholder="' + (f.hasAppSecret ? 'Saved. Type to replace' : '') + '">') +
        set('Graph API version', '', inp('graphVersion', f.graphVersion, 'txt')), 'facebook') +
      '<div class="card"><h2>Or paste a Page token</h2><div class="note">From the Graph API Explorer: a Page access token with publish_video and pages_manage_posts.</div>' +
        set('Page ID', '', '<input id="fbPid" class="txt" value="' + esc(f.pageId || '') + '">') +
        set('Page access token', '', '<input id="fbTok" type="password" class="wide" autocomplete="new-password">') +
        '<div class="set"><div class="sl"></div><div class="sc"><button class="on" id="fbUseTok">Use this token</button></div></div></div>';
  };
  PANES.facebook.live = function (p) {
    var el = $('[data-live=fb]', p); if (!el) return;
    var pc = ST.platforms.facebook, f = S.settings.facebook;
    var pages = pc.pages && pc.pages.length > 1 && pc.userConnected ? set('Page', 'Which Page goes live', '<select id="fbPage">' + opts(pc.pages.map(function (x) { return [x.id, x.name]; }), f.pageId) + '</select>') : '';
    var html = '<h2>Page</h2>' + set(pc.connected ? 'Connected' : 'Not connected', pc.connected ? 'Page: ' + esc(pc.pageName) : 'Save the Meta app below first, or paste a Page token', (pc.connected || pc.userConnected ? '<button class="danger" data-fb="disconnect">Disconnect</button>' : '') + '<button class="on" data-fb="connect"' + (f.appId && f.hasClientToken ? '' : ' disabled') + '>' + (pc.connected ? 'Connect again' : 'Connect') + '</button>', 'first') +
      pages + (pc.pagesError ? '<div class="errbox">' + esc(pc.pagesError) + '</div>' : '') + (pc.connectError ? '<div class="errbox">' + esc(pc.connectError) + '</div>' : '') + deviceBox(pc, 'Facebook');
    if (el.innerHTML !== html) {
      el.innerHTML = html;
      $$('[data-fb]', el).forEach(function (b) { b.onclick = function () { act('api/facebook/' + b.dataset.fb); }; });
      $$('[data-cancel]', el).forEach(function (b) { b.onclick = function () { act('api/facebook/cancel'); }; });
      var sel = $('#fbPage', el); if (sel) sel.onchange = function () { call('POST', 'api/facebook/page', { pageId: sel.value }).then(function (r) { toast(r.ok ? 'Page chosen' : r.error, r.ok); }); };
    }
  };
  PANES.facebook.wire = function (p) {
    $('#fbUseTok', p).onclick = function () {
      call('POST', 'api/facebook/token', { pageId: $('#fbPid', p).value, pageToken: $('#fbTok', p).value }).then(function (r) { toast(r.ok ? 'Connected' : r.error, r.ok); if (r.ok) $('#fbTok', p).value = ''; });
    };
  };

  PANES.companion = function () {
    var base = location.protocol + '//' + location.host + '/api/v1', tok = S.apiToken;
    var ds = S.settings.destinations;
    var ex = function (m, path, note) { return '<tr><td><code>' + m + ' ' + esc(path) + '</code></td><td>' + note + '</td></tr>'; };
    return '<div class="note pnote">Bitfocus Companion controls BroadcastRelay with its <b>Generic HTTP</b> connection. Send the token in a header <code>Authorization: Bearer &lt;token&gt;</code>, or add <code>?token=&lt;token&gt;</code> to the address.</div>' +
      '<div class="card"><h2>Token</h2><div class="copyrow"><pre class="cmd">' + esc(tok) + '</pre><button data-copy="' + esc(tok) + '">Copy</button></div>' +
        set('New token', 'The old one stops working, so update Companion', '<button class="danger" id="newTok">New token</button>') + '</div>' +
      '<div class="card"><h2>Base address</h2><div class="copyrow"><pre class="cmd">' + esc(base) + '</pre><button data-copy="' + esc(base) + '">Copy</button></div></div>' +
      '<div class="card"><h2>Actions (POST)</h2><table class="kv">' +
        ex('POST', '/golive', 'Start every destination marked for Go live, and the web player') +
        ex('POST', '/end', 'Stop every destination (ends YouTube/Facebook broadcasts)') +
        ex('POST', '/destinations/<name or id>/start', 'Also <code>stop</code> and <code>toggle</code>. Name, id or number (1 = first)') +
        ex('POST', '/web/start', 'Web player: <code>start</code>, <code>stop</code>, <code>toggle</code>') +
        ex('POST', '/ndi-out/toggle', 'NDI output: <code>start</code>, <code>stop</code>, <code>toggle</code>') +
        ex('POST', '/recording/on', 'Recording: <code>on</code>, <code>off</code>, <code>toggle</code>') +
        ex('POST', '/input/source/ndi', 'Switch the input: <code>stream</code> or <code>ndi</code>') +
      '</table></div>' +
      '<div class="card"><h2>Status for feedback (GET)</h2><table class="kv">' +
        ex('GET', '/status', 'JSON with <code>any_live</code>, <code>input_live</code>, <code>recording</code>, <code>web_viewers</code>, <code>loudness_short</code>, <code>cpu</code> and <code>destinations.&lt;id&gt;.live</code>') +
      '</table>' + (ds.length ? '<div class="note" style="margin-top:8px">Destination ids: ' + ds.map(function (d) { return esc(d.name) + ' = <code>' + d.id + '</code>'; }).join(' · ') + '</div>' : '') +
      '<div class="note" style="margin-top:8px">In Companion, a Generic HTTP connection can poll <code>/status</code> into variables (JSON path e.g. <code>$.any_live</code>) and color buttons from them.</div></div>';
  };
  PANES.companion.wire = function (p) { $('#newTok', p).onclick = function () { confirmBox('Make a new token?', 'Companion buttons stop working until you paste the new token into Companion.', 'New token', function () { act('api/apitoken', 'New token made'); }, true); }; };

  PANES.network = function () {
    var p = S.settings.ports;
    var row = function (k, label, sub) { return set(label, sub, inp(k, p[k], 'num', 'type="number" min="1" max="65535"')); };
    return '<div class="note pnote">BroadcastRelay uses the server\'s network directly (host networking, needed for NDI), so these ports must not be used by another app on the server. The control page is on port ' + S.ports.control + ' and the web player on ' + S.ports.public + ' (set in the app\'s environment).</div>' +
      card('Ports', row('srt', 'SRT (UDP)', 'OBS sends here') + row('rtmp', 'RTMP (TCP)', 'OBS sends here') + row('webrtc', 'WHIP / WebRTC (TCP)', 'OBS WHIP and the player\'s WebRTC signaling') + row('ice', 'WebRTC media (UDP)', 'Video to WebRTC viewers') +
        row('rtsp', 'Internal RTSP (TCP)', 'Only on this server') + row('hls', 'Internal HLS (TCP)', 'Only on this server') + row('api', 'Internal API (TCP)', 'Only on this server'), 'ports', 'Save (restarts the relay)') +
      card('WebRTC from outside', set('Public host names or IPs', 'Only if WebRTC viewers connect from outside your network: the addresses they can reach this server at. Most setups leave this empty (outside viewers use HLS).', inp('publicHosts', S.settings.network.publicHosts, 'wide')), 'network');
  };
  PANES.network.prep = function (s, v) { if (s === 'network') v.publicUrl = S.settings.network.publicUrl; return v; };

  PANES.system = function () {
    return card('Password', set('Current password', '', '<input type="password" id="pwOld" class="wide" autocomplete="current-password">', 'first') + set('New password', 'At least 8 characters. Other signed-in browsers are signed out.', '<input type="password" id="pwNew" class="wide" autocomplete="new-password">') +
        '<div class="set"><div class="sl"></div><div class="sc"><button id="pwSave" class="on">Change</button><button id="logout">Sign out</button></div></div>') +
      card('Appearance', set('Theme', 'Auto follows this device', '<div class="seg" id="themeSeg"><button data-v="auto">Auto</button><button data-v="dark">Dark</button><button data-v="light">Light</button></div>', 'first')) +
      '<div class="card"><h2>Processes</h2><div id="procs" class="note">Loading…</div><div class="set"><div class="sl"></div><div class="sc"><button id="logRef">Refresh</button></div></div></div>' +
      '<div class="card"><h2>About</h2><div class="note">BroadcastRelay ' + esc(S.version) + ' · Jerod Ulicki · Uses MediaMTX and FFmpeg. NDI® is a registered trademark of Vizrt NDI AB.</div></div>';
  };
  PANES.system.wire = function (p) {
    var paintTheme = function () { $$('#themeSeg button', p).forEach(function (b) { b.classList.toggle('on', b.dataset.v === themePref); }); };
    paintTheme();
    $$('#themeSeg button', p).forEach(function (b) { b.onclick = function () { themePref = b.dataset.v; try { localStorage.setItem('br-theme', themePref); } catch (e) {} var light = themePref === 'light' || (themePref === 'auto' && matchMedia('(prefers-color-scheme: light)').matches); document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark'); paintTheme(); }; });
    $('#pwSave', p).onclick = function () { call('POST', 'api/password', { current: $('#pwOld').value, password: $('#pwNew').value }).then(function (r) { toast(r.ok ? 'Password changed' : r.error, r.ok); if (r.ok) { $('#pwOld').value = ''; $('#pwNew').value = ''; } }); };
    $('#logout', p).onclick = function () { call('POST', 'api/logout').then(function () { showLogin(false); }); };
    var load = function () {
      call('GET', 'api/log').then(function (r) {
        if (!r.ok) return;
        $('#procs', p).innerHTML = r.procs.map(function (x) {
          return '<div style="margin-top:8px"><b style="color:var(--fg)">' + esc(x.name) + '</b> ' + chipFor(x.state) + (x.error ? ' <span class="bad">' + esc(x.error) + '</span>' : '') + (x.tail.length ? '<pre class="tailbox">' + esc(x.tail.join('\n')) + '</pre>' : '') + '</div>';
        }).join('') + '<div style="margin-top:12px"><b style="color:var(--fg)">MediaMTX log</b><pre class="tailbox" style="max-height:220px">' + esc(r.mediamtx.join('\n')) + '</pre></div>';
      });
    };
    $('#logRef', p).onclick = load; load();
  };

  start();
})();
</script>
</body>
</html>
