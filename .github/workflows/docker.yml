name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg for the tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run tests
        run: npm test

      - name: Read version from package.json
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 for a PC or server (TrueNAS), arm64 for a Raspberry Pi 5 or other ARM box
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/leonidis2013/broadcastrelay:latest
            ghcr.io/leonidis2013/broadcastrelay:${{ steps.ver.outputs.v }}
          labels: |
            org.opencontainers.image.title=BroadcastRelay
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
            org.opencontainers.image.source=https://github.com/leonidis2013/BroadcastRelay

      # the published image starts, and has MediaMTX, FFmpeg and NDI where the app looks for them
      - name: Check the published image
        run: |
          img=ghcr.io/leonidis2013/broadcastrelay:${{ steps.ver.outputs.v }}
          docker pull --platform linux/amd64 "$img"
          docker run --rm --entrypoint sh "$img" -c '
            set -x
            ls -la /usr/local/bin /usr/local/lib
            ldd /usr/local/bin/ndi-bridge
            mediamtx --version
            ffmpeg -hide_banner -encoders | grep -E "libx264|libopus"
            ffmpeg -hide_banner -protocols | grep -w srt
            setpriv --reuid=1000 --regid=1000 --clear-groups node -e "const fs=require(\"fs\");console.log(\"bridge visible to the app:\", fs.existsSync(process.env.NDI_BRIDGE), process.env.NDI_BRIDGE)"
            timeout 10 ndi-bridge list 2 || true
          '
